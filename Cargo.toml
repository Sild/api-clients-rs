[workspace]
resolver = "2"

members = [
    "crates/core",
    "crates/dedust",
    "crates/stonfi",
    "crates/swap_coffee",
    "crates/tonco_api_client",
    "crates/bidask",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Sild/api_clients_rs"

[workspace.dependencies]
# Internal
api_clients_core = { path = "crates/core", version = "0.3" }

# External
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio-test = "0.4"
serde_with = "3.14"
serde_qs = "0.15.0"
serde_derive = "1.0"
env_logger = "0.11"
reqwest-retry = "0.9"
reqwest-middleware = "0.5"
graphql_client = "0.14.0"
derive_setters = "0.1"
derive_more = { version = "2", features = ["from"] }
async-trait = "0.1"
http = "1"
