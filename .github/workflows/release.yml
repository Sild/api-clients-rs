name: Release-plz

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write

on:
  workflow_run:
    workflows: ["Build-Test"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:

jobs:
  release-plz:
    name: Release-plz
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify the checked-out commit passed CI
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$TESTED_SHA" ]; then
            echo "::error::Refusing to release untested commit $checked_out_sha; Build-Test passed for $TESTED_SHA"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_REGISTRY_TOKEN }}
